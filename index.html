<script>const LESSONS=[{"t": "Hello Backend", "level": "INICIO", "concept": "@Controller · @Get", "route": "GET /hola", "goal": "Entender qué es un endpoint y cómo un Controller responde a una petición GET.", "code": "@Controller('hola')\nexport class HolaController {\n  @Get()\n  saludar() {\n    return { mensaje: '¡Hola desde NestJS! 🚀' };\n  }\n}", "mod": "Cambia el mensaje, añade curso: 'DAM' y conserva GET /hola.", "q": "¿Qué función cumple @Get() en este Controller?"}, {"t": "API de pizzas", "level": "INICIO", "concept": "Service · array", "route": "GET /pizzas", "goal": "Separar la entrada HTTP de la lógica que gestiona datos temporales.", "code": "@Injectable()\nexport class PizzasService {\n  private pizzas = [\n    { id: 1, nombre: 'Margarita', precio: 9 },\n    { id: 2, nombre: 'Pepperoni', precio: 11 }\n  ];\n  findAll() { return this.pizzas; }\n}\n\n@Get()\nfindAll() {\n  return this.pizzasService.findAll();\n}", "mod": "Añade una tercera pizza con emoji y precio. Comprueba GET /pizzas.", "q": "¿Por qué colocamos el array en el Service y no en el Controller?"}, {"t": "Busca mascota", "level": "BÁSICO", "concept": "@Param · find()", "route": "GET /mascotas/2", "goal": "Recuperar un elemento concreto mediante un parámetro de ruta.", "code": "@Get(':id')\nfindOne(@Param('id') id: string) {\n  return this.service.findOne(Number(id));\n}\n\nfindOne(id: number) {\n  return this.mascotas.find(m => m.id === id);\n}", "mod": "Añade una mascota nueva y prueba varios IDs, incluido uno inexistente.", "q": "¿Por qué convertimos id con Number(id)?"}, {"t": "Filtra videojuegos", "level": "BÁSICO", "concept": "@Query · filter()", "route": "GET /juegos?genero=aventura", "goal": "Distinguir un parámetro de ruta de un parámetro de consulta.", "code": "@Get()\nfindAll(@Query('genero') genero?: string) {\n  return this.service.findAll(genero);\n}\n\nfindAll(genero?: string) {\n  if (!genero) return this.juegos;\n  return this.juegos.filter(j => j.genero === genero);\n}", "mod": "Crea cuatro juegos y prueba la ruta con y sin filtro de género.", "q": "¿Cuándo usarías /juegos/3 y cuándo /juegos?genero=aventura?"}, {"t": "Mi primera conexión", "level": "CONEXIÓN", "concept": "fetch · await · JSON", "route": "RN → GET /mensaje", "goal": "Realizar la primera petición HTTP desde React Native a NestJS.", "code": "const cargarMensaje = async () => {\n  const respuesta = await fetch(\n    'http://TU_IP_LOCAL:3000/mensaje'\n  );\n  const datos = await respuesta.json();\n  console.log(datos);\n};", "mod": "Configura la IP, conecta cargarMensaje a un botón y observa la respuesta.", "q": "¿Por qué el móvil necesita conocer la IP del equipo donde se ejecuta NestJS?"}, {"t": "Estado de conexión", "level": "CONEXIÓN", "concept": "useState", "route": "JSON → pantalla", "goal": "Guardar la respuesta del backend y mostrarla en la interfaz.", "code": "const [mensaje, setMensaje] = useState('Sin conectar');\n\nconst cargarMensaje = async () => {\n  const r = await fetch(API_URL + '/mensaje');\n  const datos = await r.json();\n  setMensaje(datos.texto);\n};", "mod": "Muestra 🔴 antes de conectar y 🟢 cuando llegue la respuesta.", "q": "¿Qué aporta useState frente a una variable normal?"}, {"t": "Carga automática", "level": "CONEXIÓN", "concept": "useEffect", "route": "pantalla → carga inicial", "goal": "Cargar información automáticamente cuando aparece la pantalla.", "code": "useEffect(() => {\n  cargarMensaje();\n}, []);", "mod": "Carga automáticamente, conserva un botón Recargar y muestra Cargando…", "q": "¿Qué diferencia hay entre llamar cargarMensaje desde un botón y desde useEffect?"}, {"t": "Menú del restaurante", "level": "INTEGRACIÓN", "concept": "FlatList · array", "route": "GET /productos → lista", "goal": "Representar un array recibido desde NestJS como una lista móvil.", "code": "const [productos, setProductos] = useState([]);\n\n<FlatList\n  data={productos}\n  keyExtractor={(item) => String(item.id)}\n  renderItem={({ item }) => (\n    <Text>{item.emoji} {item.nombre} · {item.precio} €</Text>\n  )}\n/>", "mod": "Convierte cada producto en una tarjeta y añade un cuarto producto desde Nest.", "q": "¿Qué relación existe entre el array del Service y data={productos}?"}, {"t": "Busca superhéroe", "level": "INTEGRACIÓN", "concept": "URL dinámica", "route": "GET /heroes/:id", "goal": "Construir desde el móvil una petición dinámica por ID.", "code": "const buscarHeroe = async () => {\n  const r = await fetch(API_URL + '/heroes/' + id);\n  const heroe = await r.json();\n  setHeroe(heroe);\n};", "mod": "Añade un campo ID, botón BUSCAR y ficha con nombre, poder y universo.", "q": "Sigue el valor id desde React Native hasta @Param('id'). ¿Por dónde pasa?"}, {"t": "Likes", "level": "ESCRITURA", "concept": "PATCH", "route": "PATCH /mascotas/:id/like", "goal": "Modificar desde el móvil un dato temporal gestionado por el Service.", "code": "const r = await fetch(API_URL + '/mascotas/1/like', {\n  method: 'PATCH'\n});\nsetMascota(await r.json());\n\n@Patch(':id/like')\ndarLike(@Param('id') id: string) {\n  return this.service.darLike(Number(id));\n}", "mod": "Añade ❤️ ME GUSTA y actualiza la cifra con el objeto devuelto.", "q": "¿Por qué los likes vuelven al valor inicial cuando reiniciamos NestJS?"}, {"t": "Mini tienda", "level": "ESCRITURA", "concept": "POST · @Body", "route": "POST /productos", "goal": "Enviar desde React Native un objeto nuevo al backend.", "code": "await fetch(API_URL + '/productos', {\n  method: 'POST',\n  headers: { 'Content-Type': 'application/json' },\n  body: JSON.stringify({ nombre, precio: Number(precio) })\n});\n\n@Post()\ncrear(@Body() producto) {\n  return this.service.crear(producto);\n}", "mod": "Añade nombre, precio, botón AÑADIR y actualiza después la lista.", "q": "¿Qué recorrido realiza el objeto hasta llegar a @Body()?"}, {"t": "Creature Lab", "level": "FINAL", "concept": "Integración Full Stack", "route": "APP ↔ API", "goal": "Recuperar el recorrido completo sin introducir arquitectura nueva.", "code": "React Native\n  → fetch()\n  → Controller\n  → Service\n  → array temporal\n  → JSON\n  → useState\n  → interfaz", "mod": "Combina listado, búsqueda y likes en una interfaz única, sencilla y profesional.", "q": "¿Podrías explicar el viaje completo de un dato sin mirar el código?"}];</script>

function conceptBlock(i,x){
 let body='';
 if(i===0) body=`<h2>Endpoint: una puerta del backend</h2><p>Un <b>endpoint</b> es una operación accesible mediante HTTP. No es solamente una URL: combina un <b>método</b> (GET, POST, PATCH...) y una <b>ruta</b>.</p><div class="conceptbox"><b>GET + /hola</b> → “quiero obtener la respuesta del endpoint /hola”.</div>`;
 else if(i===1) body=`<h2>Controller y Service no hacen lo mismo</h2><div class="layerintro"><b>Vamos a programar en dos responsabilidades.</b><div class="layerflow"><span>Petición HTTP</span><i>→</i><span>Controller</span><i>→</i><span>Service</span><i>→</i><span>Array temporal</span></div><p>Por eso el código aparecerá en pestañas. Primero entenderás el archivo que recibe la petición y después el archivo al que delega el trabajo.</p></div><div class="compare"><div><b>Controller</b><p>Se ocupa de la entrada HTTP: ruta, parámetros y petición.</p></div><div><b>Service</b><p>Se ocupa de la lógica y, en este cuaderno, accede al array que simula los datos.</p></div></div><div class="future">Más adelante el Service podrá consultar una base de datos. La separación que aprendes ahora seguirá teniendo sentido.</div>`;
 else if(i===2) body=`<h2>Path Parameter</h2><p>Un <b>Path Param</b> identifica normalmente un recurso concreto y forma parte de la propia ruta.</p><div class="conceptbox"><code>/mascotas/1</code> · <code>/mascotas/2</code> · <code>/mascotas/3</code><p>El número cambia, pero seguimos utilizando el mismo endpoint conceptual: <code>/mascotas/:id</code>.</p></div>`;
 else if(i===3) body=`<h2>Path Param ≠ Query Param</h2><div class="compare"><div><b>PATH PARAM</b><p><code>/juegos/3</code></p><p>Señala un recurso concreto. El valor forma parte de la ruta.</p></div><div><b>QUERY PARAM</b><p><code>/juegos?genero=aventura</code></p><p>Añade criterios a una petición: filtros, búsqueda, orden, paginación…</p></div></div>`;
 else if(i===4) body=`<h2>HTTP conecta los dos mundos</h2><div class="bridge"><div><b>React Native</b><p><code>fetch()</code> prepara y envía la petición.</p></div><div class="arrow">→</div><div><b>NestJS</b><p>Un endpoint recibe la petición y devuelve JSON.</p></div></div><p>Hasta ahora probábamos la API directamente. A partir de aquí será la app móvil quien la consuma.</p>`;
 else if(i===5) body=`<h2>Concepto nuevo de React: estado y useState</h2>
<p>Hasta ahora hemos podido ejecutar <code>fetch()</code> y observar la respuesta. En este ejercicio queremos algo nuevo: <b>que la respuesta cambie lo que vemos en pantalla</b>. Para eso necesitamos guardar un dato que puede cambiar.</p>
<div class="conceptbox"><h3>¿Qué es el estado?</h3><p>El <b>estado</b> es información que pertenece al componente y puede cambiar mientras usamos la app. Cuando cambia mediante su función actualizadora, React vuelve a representar la parte necesaria de la interfaz.</p></div>
<div class="conceptbox"><h3>¿Qué es un Hook?</h3><p>Un <b>Hook</b> es una función de React que nos permite utilizar capacidades de React dentro de un componente funcional. <code>useState</code> es el primer Hook que utilizamos aquí: nos permite añadir estado.</p></div>
<h3>Lee esta línea antes de programarla</h3>
<div class="terminalcmd">const [mensaje, setMensaje] =
  useState('🔴 Sin conectar');</div>
<div class="syntaxmap">
 <div class="syntaxpart"><code>mensaje</code><b>Valor actual</b><p>Es el dato que leeremos y mostraremos en la interfaz.</p></div>
 <div class="syntaxpart"><code>setMensaje</code><b>Función actualizadora</b><p>La utilizamos cuando queremos cambiar el valor de <code>mensaje</code>.</p></div>
 <div class="syntaxpart"><code>'🔴 Sin conectar'</code><b>Valor inicial</b><p>Es el valor que tendrá el estado la primera vez que aparece el componente.</p></div>
</div>
<h3>¿Qué ocurrirá cuando llegue NestJS?</h3>
<div class="beforeafter"><div class="statebox"><span class="fieldlabel">ANTES DE LA PETICIÓN</span><b>mensaje</b><p>🔴 Sin conectar</p></div><div class="bigarrow">→</div><div class="statebox"><span class="fieldlabel">DESPUÉS DE setMensaje(...)</span><b>mensaje</b><p>🟢 ¡Conexión conseguida!</p></div></div>
<div class="future"><b>Modelo mental:</b> NestJS no modifica directamente la pantalla. <code>fetch()</code> obtiene el JSON → nosotros leemos <code>datos.texto</code> → llamamos a <code>setMensaje(...)</code> → React vuelve a representar la interfaz usando el nuevo valor de <code>mensaje</code>.</div>`;
 else if(i===6) body=`<h2>Concepto nuevo de React: useEffect</h2>
<p>En el ejercicio anterior la petición comenzaba cuando el usuario pulsaba un botón. Ahora queremos que la app <b>cargue automáticamente</b> al aparecer la pantalla. Para expresar ese momento utilizaremos otro Hook: <code>useEffect</code>.</p>
<div class="conceptbox"><h3>¿Qué es un efecto?</h3><p>Un <b>efecto</b> es una operación que ocurre como consecuencia de que el componente se haya renderizado y que conecta nuestro componente con algo externo. En este caso, ese “algo externo” es nuestra API NestJS.</p></div>
<div class="terminalcmd">useEffect(() => {
  cargarMensaje();
}, []);</div>
<div class="syntaxmap">
 <div class="syntaxpart"><code>useEffect(...)</code><b>Hook</b><p>Le indica a React que queremos ejecutar un efecto.</p></div>
 <div class="syntaxpart"><code>() =&gt; { cargarMensaje(); }</code><b>Qué debe ocurrir</b><p>Ejecutamos la función que ya sabe hacer el fetch.</p></div>
 <div class="syntaxpart"><code>[]</code><b>Dependencias</b><p>En este ejercicio, el array vacío hace que la carga inicial se ejecute al montar el componente.</p></div>
</div>
<div class="beforeafter"><div class="statebox"><span class="fieldlabel">APARECE LA PANTALLA</span><b>mensaje</b><p>Cargando…</p></div><div class="bigarrow">→</div><div class="statebox"><span class="fieldlabel">EFECTO</span><b>useEffect</b><p>cargarMensaje() → fetch()</p></div><div class="bigarrow">→</div><div class="statebox"><span class="fieldlabel">RESULTADO</span><b>setMensaje</b><p>🟢 Backend disponible</p></div></div>
<div class="future"><b>Idea clave:</b> <code>useEffect</code> no sustituye a <code>fetch()</code>. Decide <b>cuándo</b> llamar a la función que realiza la petición.</div>`;
 else if(i===7) body=`<h2>Concepto nuevo de React Native: FlatList</h2>
<p>NestJS ya puede devolver <b>varios objetos</b>. Ahora necesitamos convertir ese array en una lista visual. React Native dispone de <code>FlatList</code> para representar colecciones de elementos de forma estructurada.</p>
<div class="bridge"><div><b>Nest Service</b><p>Array de productos</p></div><div class="arrow">→</div><div><b>fetch + useState</b><p>productos</p></div><div class="arrow">→</div><div><b>FlatList</b><p>una fila/tarjeta por producto</p></div></div>
<div class="terminalcmd">&lt;FlatList
  data={productos}
  keyExtractor={(item) =&gt; String(item.id)}
  renderItem={({ item }) =&gt; (
    &lt;Text&gt;{item.nombre}&lt;/Text&gt;
  )}
/&gt;</div>
<div class="syntaxmap">
 <div class="syntaxpart"><code>data={productos}</code><b>Los datos</b><p>Es el array guardado en el estado.</p></div>
 <div class="syntaxpart"><code>renderItem</code><b>Cómo se ve uno</b><p>Define qué interfaz construimos para cada objeto del array.</p></div>
 <div class="syntaxpart"><code>keyExtractor</code><b>Identidad</b><p>Proporciona a React una clave estable para distinguir cada elemento.</p></div>
</div>
<div class="future"><b>Modelo mental:</b> FlatList no obtiene los datos. <code>fetch()</code> los obtiene, <code>useState</code> los conserva y <code>FlatList</code> los representa.</div>`;
 else if(i===8) body=`<h2>Recuperamos Path Params: ahora nacen en React Native</h2>
<p>Ya sabes que NestJS puede recibir un identificador mediante una ruta como <code>/heroes/:id</code>. La novedad es descubrir <b>de dónde sale ese valor cuando tenemos frontend</b>.</p>
<div class="conceptbox"><h3>Ejemplo</h3><p>El usuario escribe <b>2</b>. React Native construye <code>/heroes/2</code>. NestJS recibe ese <b>2</b> mediante <code>@Param('id')</code>.</p></div>
<div class="beforeafter"><div class="statebox"><span class="fieldlabel">1 · REACT NATIVE</span><code>id = "2"</code><p>El valor está en el estado.</p></div><div class="bigarrow">→</div><div class="statebox"><span class="fieldlabel">2 · URL</span><code>/heroes/2</code><p>El ID pasa a formar parte del path.</p></div><div class="bigarrow">→</div><div class="statebox"><span class="fieldlabel">3 · NESTJS</span><code>@Param('id')</code><p>El Controller recupera "2".</p></div></div>
<div class="terminalcmd">fetch(API_URL + '/heroes/' + id)

@Get(':id')
findOne(@Param('id') id: string) { ... }</div>
<div class="future"><b>Conexión con lo aprendido:</b> no estamos aprendiendo otro tipo de parámetro. Estamos conectando el Path Param del backend con un dato que nace en la interfaz móvil.</div>`;
 else if(i===9) body=`<h2>Concepto nuevo HTTP: PATCH</h2>
<p>Hasta ahora nuestras peticiones eran principalmente <b>GET</b>: pedíamos información sin pretender modificarla. En este ejercicio el usuario pulsa “Me gusta” y queremos cambiar una parte de una mascota existente: sus <code>likes</code>.</p>
<div class="compare"><div><b>GET</b><p><code>GET /mascotas/1</code></p><p>Consulta información.</p></div><div><b>PATCH</b><p><code>PATCH /mascotas/1/like</code></p><p>Solicita una modificación parcial del recurso.</p></div></div>
<div class="terminalcmd">fetch(API_URL + '/mascotas/1/like', {
  method: 'PATCH'
});</div>
<div class="syntaxmap">
 <div class="syntaxpart"><code>fetch(URL, {...})</code><b>Petición</b><p>Además de la URL enviamos opciones.</p></div>
 <div class="syntaxpart"><code>method: 'PATCH'</code><b>Método HTTP</b><p>Indica al backend que esta petición pretende modificar.</p></div>
 <div class="syntaxpart"><code>@Patch(':id/like')</code><b>NestJS</b><p>Asocia esa petición PATCH con el método del Controller.</p></div>
</div>
<div class="beforeafter"><div class="statebox"><span class="fieldlabel">ARRAY EN EL SERVICE</span><p>Toby · ❤️ 14</p></div><div class="bigarrow">→</div><div class="statebox"><span class="fieldlabel">PATCH</span><p>darLike(1)</p></div><div class="bigarrow">→</div><div class="statebox"><span class="fieldlabel">ARRAY MODIFICADO</span><p>Toby · ❤️ 15</p></div></div>
<div class="future"><b>Persistencia simulada:</b> estamos modificando el array en memoria. El cambio funciona mientras el servidor está ejecutándose, pero se pierde al reiniciar NestJS. Más adelante una base de datos hará persistente esta modificación.</div>`;
 else if(i===10) body=`<h2>POST y el cuerpo de la petición</h2><p>Para crear un recurso necesitamos enviar datos. React Native transforma el objeto a JSON; NestJS lo recupera mediante <code>@Body()</code>.</p>`;

<div class="compare"><div><b>POST</b><p>Expresa la intención de crear un nuevo recurso.</p><code>method: 'POST'</code></div><div><b>@Body()</b><p>NestJS recupera los datos enviados dentro del cuerpo de la petición.</p><code>@Body() producto</code></div></div>

 else body=`<h2>Integración final guiada: reutilizar sin saltos</h2><p>El ejercicio 12 no introduce una arquitectura nueva. Combina <b>GET de colección, GET por Path Param, PATCH, useState, useEffect y FlatList</b> dentro de una única miniapp.</p>
